# Example docker-compose.yml for rustdeskadmin-server.
#
# Copy this file to docker-compose.yml, replace the placeholders, then run:
#   docker compose pull
#   docker compose run --rm --no-deps hbbs rustdesk-utils genadminkey "<label>"
#   docker compose up -d
#
# Save the private key printed by genadminkey immediately and paste it into the
# paired rustdeskadmin-client. The server stores only the public key.
#
# ADMIN_API_JWT_SECRET and ADMIN_API_PORT below are both optional. Defaults:
# ADMIN_API_PORT=21114, and an ephemeral JWT secret regenerated on every
# restart (admin clients just re-login after a restart if you skip it). Set
# ADMIN_API_JWT_SECRET explicitly only if you want admin sessions to survive
# routine restarts.
#
# The admin API is fail-closed: hbbs only binds port 21114 after it starts with
# at least one enrolled admin key. The sequence above avoids a first-start-empty
# restart. If hbbs was already started with zero keys, enroll a key and restart
# hbbs once; later key enroll/revoke changes hot-reload automatically.

services:
  hbbs:
    image: ghcr.io/hrezenmsft/rustdeskadmin-server:latest
    container_name: rustdeskadmin-hbbs
    command: hbbs -r <your-domain-or-ip>:21117
    environment:
      ADMIN_API_JWT_SECRET: <generate-a-long-random-secret>
      ADMIN_API_PORT: 21114
    ports:
      - "21114:21114"
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk-data:/root
    restart: unless-stopped

  hbbr:
    image: ghcr.io/hrezenmsft/rustdeskadmin-server:latest
    container_name: rustdeskadmin-hbbr
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk-data:/root
    restart: unless-stopped

volumes:
  rustdesk-data:
